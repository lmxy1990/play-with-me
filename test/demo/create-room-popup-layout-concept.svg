    <circle cx="358" cy="340" r="10" fill="none" stroke="#dba646" stroke-width="3"/>
    <text x="378" y="346" class="goldText" font-size="19">7席</text>
    <rect x="434" y="320" width="82" height="40" rx="20" fill="#2b1707" stroke="#e0a941" stroke-width="2"/>
    <circle cx="458" cy="340" r="10" fill="none" stroke="#dba646" stroke-width="3"/>
    <text x="478" y="346" class="goldText" font-size="19">8席</text>
    <rect x="234" y="376" width="82" height="40" rx="20" fill="#2b1707" stroke="#e0a941" stroke-width="2"/>
    <circle cx="258" cy="396" r="10" fill="none" stroke="#dba646" stroke-width="3"/>
    <text x="278" y="402" class="goldText" font-size="19">9席</text>

    <rect x="234" y="462" width="330" height="48" rx="12" fill="#1b0e04" stroke="#e7ad38" stroke-width="2"/>
    <circle cx="266" cy="486" r="22" fill="#bb7c1f" stroke="#ffe081" stroke-width="2"/>
