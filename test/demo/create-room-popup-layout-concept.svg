  <g filter="url(#shadow)">
    <path d="M198 110 H612 C632 110 648 126 648 146 V592 C648 612 632 628 612 628 H198 C178 628 162 612 162 592 V146 C162 126 178 110 198 110Z" fill="url(#metal)"/>
    <path d="M668 110 H1082 C1102 110 1118 126 1118 146 V592 C1118 612 1102 628 1082 628 H668 C648 628 632 612 632 592 V146 C632 126 648 110 668 110Z" fill="url(#metal)"/>
    <path d="M218 132 H594 C611 132 624 145 624 162 V576 C624 593 611 606 594 606 H218 C201 606 188 593 188 576 V162 C188 145 201 132 218 132Z" fill="url(#plate)" stroke="#f7cf6b" stroke-width="3"/>
    <path d="M686 132 H1062 C1079 132 1092 145 1092 162 V576 C1092 593 1079 606 1062 606 H686 C669 606 656 593 656 576 V162 C656 145 669 132 686 132Z" fill="url(#plate)" stroke="#f7cf6b" stroke-width="3"/>
    <rect x="620" y="110" width="40" height="518" rx="18" fill="#211004" stroke="#f0be4c" stroke-opacity=".42" stroke-width="2"/>
    <path d="M640 126 V612" stroke="#f7cf6b" stroke-opacity=".32" stroke-width="3"/>
  </g>

  <g opacity=".65">
    <path d="M224 172 H588" class="thin"/>
    <path d="M224 278 H588" class="thin"/>
    <path d="M224 420 H588" class="thin"/>
    <path d="M694 198 H1056" class="thin"/>
    <path d="M694 554 H1056" class="thin"/>
