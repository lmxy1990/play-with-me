    <text x="772" y="527" fill="#76ffe5" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="16" text-anchor="middle">标准</text>
    <rect x="832" y="504" width="96" height="34" rx="17" fill="#38240d" stroke="#ffcd63" stroke-width="2"/>
    <text x="880" y="527" fill="#ffdf83" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="16" text-anchor="middle">无警长</text>
    <rect x="946" y="504" width="84" height="34" rx="17" fill="#372549" stroke="#c68cff" stroke-width="2"/>
    <text x="988" y="527" fill="#d9b7ff" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="16" text-anchor="middle">6-9席</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="872" y="562" width="184" height="50" rx="11" fill="url(#goldButton)" stroke="#ffe389" stroke-width="3"/>
