<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#17100b"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d6e5ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d6e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1c65b"/>
      <stop offset=".22" stop-color="#7b4a12"/>
      <stop offset=".55" stop-color="#c98b28"/>
      <stop offset="1" stop-color="#3b2108"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c4518"/>
      <stop offset=".48" stop-color="#2c1908"/>
      <stop offset="1" stop-color="#8b5b1e"/>
    </linearGradient>
    <linearGradient id="goldButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".5" stop-color="#c78324"/>
      <stop offset="1" stop-color="#5a310c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".56"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffcf55" flood-opacity=".65"/>
    </filter>
    <style>
      .goldText { fill:#ffe39a; font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-weight:700; }
      .softText { fill:#cfa85a; font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-weight:700; }
      .darkText { fill:#1d1005; font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-weight:800; }
      .line { stroke:#f2bd4b; stroke-opacity:.45; stroke-width:2; }
      .thin { stroke:#ffdf82; stroke-opacity:.34; stroke-width:1.2; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="615" cy="118" r="110" fill="url(#moon)" opacity=".58"/>
  <path d="M0 470 C170 390 245 430 382 365 C545 286 660 365 801 305 C950 242 1120 310 1280 238 L1280 720 L0 720Z" fill="#091018" opacity=".82"/>
  <path d="M0 515 C160 456 270 500 395 442 C553 370 697 445 820 386 C1000 299 1110 394 1280 332 L1280 720 L0 720Z" fill="#15100b" opacity=".92"/>
